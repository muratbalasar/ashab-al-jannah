version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      web:
        patterns:
          - "fastapi"
          - "uvicorn*"
          - "pydantic*"
          - "jinja2"
          - "python-multipart"
      data:
        patterns:
          - "sqlalchemy"
          - "alembic"
          - "pandas"
      dev:
        patterns:
          - "pytest*"
          - "black"
          - "isort"
          - "flake8"
          - "robotframework*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Amsterdam"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Amsterdam"
    labels:
      - dependencies
      - github-actions
