name: CI/CD – Ashab al-Jannah (Azure Container App)

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "1-UserStories"
      - "2-TestScenarios"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_azure:
        description: "Azure Container App deployen na succesvolle tests (alleen main)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ashab-al-jannah
  # Azure resource-namen (centraal beheerd)
  AZ_RESOURCE_GROUP: rg-ashab-al-jannah
  AZ_LOCATION: westeurope
  AZ_CONTAINER_APP_ENV: cae-ashab-al-jannah
  AZ_CONTAINER_APP: ashab-al-jannah

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1 – Code kwaliteit + unit tests (black, isort, flake8, pytest)
  # ────────────────────────────────────────────────────────────────
  kwaliteit:
    name: "Kwaliteit & unit tests"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Afhankelijkheden installeren
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Opmaak controleren (black + isort)
        run: |
          black --check --diff src tests migrations
          isort --check-only --diff src tests migrations

      - name: Linting (flake8)
        run: flake8 src tests migrations

      - name: Unit tests met coverage (incl. migratiecontrole)
        run: pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90

      - name: Coverage-rapport uploaden
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          retention-days: 14

  # ────────────────────────────────────────────────────────────────
  # Job 2 – Dependency security scan
  # ────────────────────────────────────────────────────────────────
  security-scan:
    name: "Dependency security scan (pip-audit)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - name: Kwetsbaarheden scannen
        run: >
          pip-audit --progress-spinner off
          -r requirements.txt -r requirements-ai.txt

  # ────────────────────────────────────────────────────────────────
  # Job 3 – Functionele acceptatietests (Robot Framework tegen draaiende API)
  # ────────────────────────────────────────────────────────────────
  functionele-tests:
    name: "Functionele tests (Robot Framework)"
    runs-on: ubuntu-24.04
    needs: kwaliteit
    env:
      AUTH_MODE: dev
      DATABASE_URL: sqlite:///./output/robot.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Afhankelijkheden installeren
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Database migreren en API starten
        run: |
          mkdir -p output/robot-results
          alembic upgrade head
          uvicorn --factory ledenadmin.main:create_app --port 8000 > output/robot-results/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break || sleep 1
          done

      - name: Robot Framework uitvoeren
        run: >
          robot --outputdir output/robot-results
          --variable BASE_URL:http://127.0.0.1:8000
          tests/functional

      - name: Samenvatting publiceren
        if: always()
        run: |
          python - <<'EOF'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          output = Path("output/robot-results/output.xml")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if output.exists() and summary:
              stat = ET.parse(output).getroot().find(".//statistics/total/stat")
              passed, failed = int(stat.get("pass", 0)), int(stat.get("fail", 0))
              icon = "✅" if failed == 0 else "❌"
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(f"## {icon} Robot Framework: {passed} geslaagd, {failed} mislukt\n")
          EOF

      - name: Resultaten uploaden
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-resultaten-${{ github.sha }}
          path: output/robot-results/
          retention-days: 30

  # ────────────────────────────────────────────────────────────────
  # Job 4 – Docker image bouwen en container rooktest
  # ────────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker image bouwen & rooktest"
    runs-on: ubuntu-24.04
    needs: [kwaliteit, security-scan]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Image bouwen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starten en health controleren
        run: |
          docker run -d --name ledenadmin -p 8000:8000 \
            -e APP_ENV=development -e AUTH_MODE=dev \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && exit 0 || sleep 1
          done
          docker logs ledenadmin
          exit 1

      # Back-up en herstel met Litestream: schrijf een lid weg, gooi de container en zijn
      # database weg en start een nieuwe container die de database uit de back-up terugzet.
      # Lokale map als replica (file://) in plaats van Azure Blob Storage.
      - name: Litestream back-up en herstel
        run: |
          set -euo pipefail
          mkdir -p /tmp/replica && chmod 777 /tmp/replica
          start() {
            # AUTH_MODE=dev is in productie verboden; daarom APP_ENV=development.
            docker run -d --name "$1" -p 8001:8000 \
              -e APP_ENV=development -e AUTH_MODE=dev \
              -e LITESTREAM_REPLICA_URL=file:///replica -v /tmp/replica:/replica \
              ${{ env.IMAGE_NAME }}:${{ github.sha }} >/dev/null
            for i in $(seq 1 30); do
              curl -sf http://127.0.0.1:8001/api/v1/health >/dev/null && return 0 || sleep 1
            done
            docker logs "$1"; return 1
          }
          start backup-1
          curl -sf -X POST http://127.0.0.1:8001/o/standaard/api/v1/members \
            -H "X-Dev-Roles: beheerder" -H "Content-Type: application/json" \
            -d '{"name": "Back-up Test", "email": "backup@voorbeeld.nl"}'
          docker stop backup-1 >/dev/null   # SIGTERM: Litestream synchroniseert nog één keer
          docker rm backup-1 >/dev/null
          start backup-2
          curl -sf http://127.0.0.1:8001/o/standaard/api/v1/members -H "X-Dev-Roles: beheerder" \
            | grep -q "backup@voorbeeld.nl"
          docker rm -f backup-2 >/dev/null
          echo "Database teruggezet uit de back-up."

      - name: Productie met SQLite zonder back-up weigert te starten
        run: |
          if timeout 60 docker run --rm -e APP_ENV=production ${{ env.IMAGE_NAME }}:${{ github.sha }}; then
            echo "De container had moeten weigeren te starten zonder LITESTREAM_REPLICA_URL"; exit 1
          fi

      - name: Image scannen op kwetsbaarheden (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # DAST: passieve OWASP ZAP-scan tegen de draaiende container (spidert de web-UI).
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8000/leden
          cmd_options: "-a"
          fail_action: false # eerst rapporteren; zet op true zodra de bevindingen beoordeeld zijn
          allow_issue_writing: false
          artifact_name: zap-rapport-${{ github.sha }}

  # ────────────────────────────────────────────────────────────────
  # Job 4b – Statische security-analyse (SAST) en geheimen in de code
  # ────────────────────────────────────────────────────────────────
  sast:
    name: "SAST & secret scan (Bandit, Gitleaks)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # volledige historie voor de secret scan
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bandit (Python SAST, medium en hoger)
        run: |
          pip install bandit
          bandit -r src -ll

      - name: Gitleaks (geheimen in code en git-historie)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: "CodeQL (Python en JavaScript)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python, javascript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  # ────────────────────────────────────────────────────────────────
  # Job 5 – Publiceren naar GitHub Container Registry (alleen main)
  # ────────────────────────────────────────────────────────────────
  docker-push:
    name: "Image publiceren naar ghcr.io"
    runs-on: ubuntu-24.04
    needs: [docker-build, functionele-tests, sast, codeql]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Image-naam bepalen
        id: image
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bouwen en pushen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────
  # Job 6 – Deploy naar Azure Container Apps (handmatig, alleen main)
  #
  # Vereiste GitHub Secrets (environment "production"):
  #   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID – OIDC federated credential
  #   GHCR_PULL_TOKEN  – PAT (classic) met alleen read:packages, zodat Azure de image kan pullen
  # Vereiste variabele (Settings → Variables, environment "production"):
  #   LITESTREAM_REPLICA_URL – back-up van de SQLite-database, abs://<opslagaccount>@<container>/<pad>
  #   (de managed identity van de app heeft "Storage Blob Data Contributor"; zie README)
  # Optioneel (AI, zie README "AI-dienst kiezen"): variabele AI_PROVIDER (local, openai, gemini of
  #   anthropic) kiest de dienst. Per dienst: OPENAI_MODEL + OPENAI_BASE_URL + secret
  #   OPENAI_API_KEY; GEMINI_MODEL (+ GEMINI_REASONING_EFFORT) + secret GEMINI_API_KEY;
  #   ANTHROPIC_MODEL + secret ANTHROPIC_API_KEY. AI_MODEL geldt als <DIENST>_MODEL leeg is.
  #   Alles mag naast elkaar staan: wisselen = alleen AI_PROVIDER aanpassen en deployen.
  # Helpassistent (US16): ASSISTANT_ENABLED=true (vereist een externe AI_PROVIDER) en optioneel
  #   ASSISTANT_DAILY_LIMIT_PER_USER, ASSISTANT_DAILY_LIMIT_TOTAL, ASSISTANT_MAX_QUESTION_CHARS,
  #   ASSISTANT_MAX_OUTPUT_TOKENS; zie README "Helpassistent aanzetten".
  # Easy Auth (Entra ID) wordt eenmalig ingesteld; zie README "Deployment naar Azure".
  # ────────────────────────────────────────────────────────────────
  deploy-azure:
    name: "Deploy naar Azure Container Apps"
    runs-on: ubuntu-24.04
    needs: docker-push
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_azure
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Inloggen bij Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resource group en Container Apps-omgeving
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az group show -n "$AZ_RESOURCE_GROUP" >/dev/null 2>&1 \
            || az group create -n "$AZ_RESOURCE_GROUP" -l "$AZ_LOCATION" --tags project=ashab-al-jannah
          az containerapp env show -n "$AZ_CONTAINER_APP_ENV" -g "$AZ_RESOURCE_GROUP" >/dev/null 2>&1 \
            || az containerapp env create -n "$AZ_CONTAINER_APP_ENV" -g "$AZ_RESOURCE_GROUP" -l "$AZ_LOCATION"

      - name: Container App aanmaken of bijwerken
        env:
          IMAGE: ${{ needs.docker-push.outputs.image }}:${{ github.sha }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          LITESTREAM_REPLICA_URL: ${{ vars.LITESTREAM_REPLICA_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'local' }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_REASONING_EFFORT: ${{ vars.GEMINI_REASONING_EFFORT }}
          ASSISTANT_ENABLED: ${{ vars.ASSISTANT_ENABLED || 'false' }}
          ASSISTANT_DAILY_LIMIT_PER_USER: ${{ vars.ASSISTANT_DAILY_LIMIT_PER_USER }}
          ASSISTANT_DAILY_LIMIT_TOTAL: ${{ vars.ASSISTANT_DAILY_LIMIT_TOTAL }}
          ASSISTANT_MAX_QUESTION_CHARS: ${{ vars.ASSISTANT_MAX_QUESTION_CHARS }}
          ASSISTANT_MAX_OUTPUT_TOKENS: ${{ vars.ASSISTANT_MAX_OUTPUT_TOKENS }}
        run: |
          set -euo pipefail
          : "${LITESTREAM_REPLICA_URL:?Zet de variabele LITESTREAM_REPLICA_URL (zie README, Deployment)}"
          # Controleer de AI-instellingen vóórdat de oude container stopt: met een fout start de
          # nieuwe niet en is de app onbereikbaar.
          AI_PROVIDER=$(echo "$AI_PROVIDER" | tr '[:upper:]' '[:lower:]')
          case "$AI_PROVIDER" in
            local) ;;
            openai)
              : "${OPENAI_API_KEY:?Secret OPENAI_API_KEY ontbreekt}"
              : "${OPENAI_MODEL:-${AI_MODEL:?OPENAI_MODEL (of AI_MODEL) ontbreekt}}" ;;
            gemini)
              : "${GEMINI_API_KEY:?Secret GEMINI_API_KEY ontbreekt}"
              : "${GEMINI_MODEL:-${AI_MODEL:?GEMINI_MODEL (of AI_MODEL) ontbreekt}}" ;;
            anthropic)
              : "${ANTHROPIC_API_KEY:?Secret ANTHROPIC_API_KEY ontbreekt}"
              : "${ANTHROPIC_MODEL:-${AI_MODEL:?ANTHROPIC_MODEL (of AI_MODEL) ontbreekt}}" ;;
            *) echo "::error::Onbekende AI_PROVIDER '$AI_PROVIDER' (local, openai, gemini of anthropic)"; exit 1 ;;
          esac
          GEMINI_REASONING_EFFORT=$(echo "$GEMINI_REASONING_EFFORT" | tr '[:upper:]' '[:lower:]')
          case "$GEMINI_REASONING_EFFORT" in
            ""|none|minimal|low|medium|high) ;;
            *) echo "::error::GEMINI_REASONING_EFFORT moet none, minimal, low, medium of high zijn (nu: '$GEMINI_REASONING_EFFORT')"; exit 1 ;;
          esac
          ASSISTANT_ENABLED=$(echo "$ASSISTANT_ENABLED" | tr '[:upper:]' '[:lower:]')
          if [ "$ASSISTANT_ENABLED" = "true" ] && [ "$AI_PROVIDER" = "local" ]; then
            echo "::warning::ASSISTANT_ENABLED=true werkt alleen met AI_PROVIDER=openai, gemini of anthropic; de assistent blijft uit."
          fi
          # Ongeldige waarden laten de app niet starten: hier al weigeren (grenzen als in config.py).
          case "$ASSISTANT_ENABLED" in
            true|false) ;;
            *) echo "::error::ASSISTANT_ENABLED moet true of false zijn (nu: '$ASSISTANT_ENABLED')"; exit 1 ;;
          esac
          check_range() {
            local value="${!1}"
            if [ -n "$value" ] && { ! [[ "$value" =~ ^[0-9]+$ ]] || [ "$value" -lt "$2" ] || [ "$value" -gt "$3" ]; }; then
              echo "::error::$1 moet een geheel getal van $2 t/m $3 zijn (nu: '$value')"; exit 1
            fi
          }
          check_range ASSISTANT_DAILY_LIMIT_PER_USER 1 100
          check_range ASSISTANT_DAILY_LIMIT_TOTAL 1 5000
          check_range ASSISTANT_MAX_QUESTION_CHARS 50 1000
          check_range ASSISTANT_MAX_OUTPUT_TOKENS 100 1500
          ENV_VARS=(APP_ENV=production AUTH_MODE=easyauth
                    LITESTREAM_REPLICA_URL="$LITESTREAM_REPLICA_URL" AI_PROVIDER="$AI_PROVIDER"
                    ASSISTANT_ENABLED="$ASSISTANT_ENABLED")
          SECRETS=()
          for NAME in ASSISTANT_DAILY_LIMIT_PER_USER ASSISTANT_DAILY_LIMIT_TOTAL \
                      ASSISTANT_MAX_QUESTION_CHARS ASSISTANT_MAX_OUTPUT_TOKENS \
                      AI_MODEL OPENAI_MODEL OPENAI_BASE_URL ANTHROPIC_MODEL \
                      GEMINI_MODEL GEMINI_REASONING_EFFORT; do
            if [ -n "${!NAME}" ]; then ENV_VARS+=("$NAME=${!NAME}"); fi
          done
          if [ -n "$OPENAI_API_KEY" ]; then
            SECRETS+=(openai-api-key="$OPENAI_API_KEY")
            ENV_VARS+=(OPENAI_API_KEY=secretref:openai-api-key)
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            SECRETS+=(anthropic-api-key="$ANTHROPIC_API_KEY")
            ENV_VARS+=(ANTHROPIC_API_KEY=secretref:anthropic-api-key)
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            SECRETS+=(gemini-api-key="$GEMINI_API_KEY")
            ENV_VARS+=(GEMINI_API_KEY=secretref:gemini-api-key)
          fi

          # SQLite met Litestream: altijd precies één container (twee schrijvers = corrupte data).
          if az containerapp show -n "$AZ_CONTAINER_APP" -g "$AZ_RESOURCE_GROUP" >/dev/null 2>&1; then
            # Een oude installatie met Azure SQL eerst overzetten; anders start de app leeg.
            OLD_DB=$(az containerapp show -n "$AZ_CONTAINER_APP" -g "$AZ_RESOURCE_GROUP" \
              --query "length(properties.template.containers[0].env[?name=='DATABASE_URL'])" -o tsv)
            if [ "$OLD_DB" != "0" ]; then
              echo "::error::De app gebruikt nog DATABASE_URL (Azure SQL). Zet eerst de gegevens over; zie README, 'Overstap van Azure SQL'."
              exit 1
            fi
            az containerapp registry set -n "$AZ_CONTAINER_APP" -g "$AZ_RESOURCE_GROUP" \
              --server ghcr.io --username "${{ github.repository_owner }}" --password "$GHCR_PULL_TOKEN"
            if [ ${#SECRETS[@]} -gt 0 ]; then
              az containerapp secret set -n "$AZ_CONTAINER_APP" -g "$AZ_RESOURCE_GROUP" --secrets "${SECRETS[@]}"
            fi
            # Geen overlap tussen oude en nieuwe container: eerst de oude stoppen (Litestream
            # synchroniseert bij het stoppen nog één keer), dan pas de nieuwe starten. Kost een
            # paar seconden onbereikbaarheid.
            for REV in $(az containerapp revision list -n "$AZ_CONTAINER_APP" -g "$AZ_RESOURCE_GROUP" \
                           --query "[?properties.active].name" -o tsv); do
              az containerapp revision deactivate -n "$AZ_CONTAINER_APP" -g "$AZ_RESOURCE_GROUP" --revision "$REV"
            done
            sleep 20
            az containerapp update -n "$AZ_CONTAINER_APP" -g "$AZ_RESOURCE_GROUP" \
              --image "$IMAGE" --set-env-vars "${ENV_VARS[@]}" \
              --min-replicas 0 --max-replicas 1
          else
            SECRET_ARGS=()
            if [ ${#SECRETS[@]} -gt 0 ]; then SECRET_ARGS=(--secrets "${SECRETS[@]}"); fi
            az containerapp create -n "$AZ_CONTAINER_APP" -g "$AZ_RESOURCE_GROUP" \
              --environment "$AZ_CONTAINER_APP_ENV" --image "$IMAGE" \
              --registry-server ghcr.io --registry-username "${{ github.repository_owner }}" \
              --registry-password "$GHCR_PULL_TOKEN" \
              "${SECRET_ARGS[@]}" --env-vars "${ENV_VARS[@]}" \
              --target-port 8000 --ingress external \
              --cpu 0.5 --memory 1Gi --min-replicas 0 --max-replicas 1 \
              --system-assigned \
              --tags project=ashab-al-jannah
          fi

      - name: Publieke URL ophalen
        run: |
          FQDN=$(az containerapp show -n "$AZ_CONTAINER_APP" -g "$AZ_RESOURCE_GROUP" \
                   --query properties.configuration.ingress.fqdn -o tsv)
          echo "AZURE_URL=https://${FQDN}" >> "$GITHUB_ENV"
          echo "## Live URL: https://${FQDN}" >> "$GITHUB_STEP_SUMMARY"

      - name: Rooktest op Azure
        # Ruime wachttijd: bij scale-to-zero start de container en zet Litestream eerst de database terug.
        run: |
          pip install -r requirements-dev.txt --quiet
          robot --include smoke --outputdir output/robot-results-azure \
            --variable BASE_URL:"$AZURE_URL" --variable HEALTH_TIMEOUT:300s tests/functional

      - name: Rooktestresultaten uploaden
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-resultaten-azure-${{ github.sha }}
          path: output/robot-results-azure/
          retention-days: 30
