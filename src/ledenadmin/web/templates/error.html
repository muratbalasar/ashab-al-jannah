{% extends "base.html" %}
{% block title %}Fout {{ status_code }} – {{ app_name }}{% endblock %}
{% block content %}
<article>
  <h1>Er ging iets mis</h1>
  <p role="alert">{{ message }}</p>
  {% if error_code %}<p><small>Foutcode: <code data-select-all>{{ error_code }}</code></small></p>{% endif %}
  <p><a href="{{ org }}/">Terug naar het overzicht</a></p>
</article>
{% endblock %}
